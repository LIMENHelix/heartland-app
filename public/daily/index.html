<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rejuv Daily</title>
<meta name="description" content="Eat, train and sleep on a schedule. Free, from Rejuv Men's Health & Wellness.">
<meta name="theme-color" content="#0B0F12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/mark.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800&family=PT+Sans:wght@400;700&family=Bai+Jamjuree:wght@600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<header class="topbar">
  <span class="rejuv-wordmark">Rejuv</span>
  <span class="topbar__t">Rejuv Daily</span>
</header>

<main id="main"></main>

<!-- Always present once he is set up. The first version had no nav at all:
     you picked your goals, the screen changed, and there was no way back to
     the thing you had just tapped. -->
<nav class="tabbar" id="tabbar" hidden>
  <button class="tab" data-act="go" data-s="today">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 12h4l2.5-6 3 12L16 12h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Today</span>
  </button>
  <button class="tab" data-act="go" data-s="rate">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M5 19V10M12 19V5M19 19v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Rate</span>
  </button>
  <button class="tab" data-act="go" data-s="setup">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Setup</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__head">
      <h2 class="h2" id="sheetTitle"></h2>
      <button class="iconbtn" data-close aria-label="Close">
        <svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>
</div>

<script src="daily.js"></script>
</body>
</html>
