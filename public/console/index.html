<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartland Console</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800&family=PT+Sans:wght@400;700&family=Bai+Jamjuree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="console.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login" id="login" hidden>
  <form class="login__card" id="loginForm">
    <div class="brandmark">
      <svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--gold)"/><path d="M13 10v20M27 10v20M13 20h14" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="square"/></svg>
    </div>
    <p class="eyebrow">Heartland Men's Health</p>
    <h1 class="display">Coordinator console</h1>
    <p class="lede">Retention, messaging and patient content.</p>

    <label class="field">
      <span class="field__l">Email</span>
      <input class="input" id="liEmail" type="email" autocomplete="username" required>
    </label>
    <label class="field">
      <span class="field__l">Password</span>
      <input class="input" id="liPass" type="password" autocomplete="current-password" required>
    </label>
    <p class="formerr" id="liErr" hidden></p>
    <button class="btn btn--primary" type="submit">Sign in</button>
    <p class="finetext" style="margin-top:18px">
      This console shows patient health information. Sign out when you step away.
    </p>
  </form>
</div>

<!-- ============ CONSOLE ============ -->
<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="side__brand">
      <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--gold)"/><path d="M13 10v20M27 10v20M13 20h14" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="square"/></svg>
      <span>Heartland</span>
    </div>
    <nav class="side__nav" id="nav">
      <button class="navbtn is-active" data-view="board">
        <span class="navbtn__t">Today's list</span>
        <span class="navbtn__c" id="navBoardCount"></span>
      </button>
      <button class="navbtn" data-view="inbox">
        <span class="navbtn__t">Questions</span>
        <span class="navbtn__c" id="navInboxCount"></span>
      </button>
      <button class="navbtn" data-view="signups">
        <span class="navbtn__t">New sign-ups</span>
        <span class="navbtn__c" id="navSignupCount"></span>
      </button>
      <button class="navbtn" data-view="checkins">
        <span class="navbtn__t">Check-ins</span>
        <span class="navbtn__c" id="navCheckCount"></span>
      </button>
      <button class="navbtn" data-view="patients"><span class="navbtn__t">Patients</span></button>
      <button class="navbtn" data-view="me"><span class="navbtn__t">My details</span></button>
      <button class="navbtn" data-view="compose"><span class="navbtn__t">Send a message</span></button>
      <button class="navbtn" data-view="articles"><span class="navbtn__t">Articles</span></button>
      <button class="navbtn" data-view="sent"><span class="navbtn__t">Sent</span></button>
      <button class="navbtn navbtn--admin" data-view="team" hidden><span class="navbtn__t">The team</span></button>
    </nav>
    <div class="side__foot">
      <p class="side__who" id="whoami"></p>
      <button class="btn btn--ghost btn--sm" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__head">
      <h2 class="h2" id="modalTitle"></h2>
      <button class="iconbtn" data-close aria-label="Close">
        <svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<script src="console.js"></script>
</body>
</html>
